; PlatformIO Project Configuration File
;
; M5Paper Schedule Display (thin client) — host server does ICS/SSL/alarm logic
;
;   build : pio run
;   flash : pio run -t upload            (auto-detects /dev/ttyACM*)
;   log   : pio device monitor

[platformio]
src_dir = .
default_envs = m5paper

[env:m5paper]
platform = espressif32@6.4.0
board = m5stack-fire
framework = arduino

; M5Paper specific settings
board_build.partitions = partitions_m5paper.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB

; Only compile the sketch sources at repo root
build_src_filter = +<*.ino> +<*.cpp> +<*.h> -<.pio/> -<test/> -<server/> -<sdcard/> -<ringtone/> -<tools/>

; Libraries
lib_deps =
    m5stack/M5EPD@^0.1.5
    bblanchon/ArduinoJson@^6.21.3

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DDEFAULT_SERVER_HOST=\"10.1.1.2\"
    -DDEFAULT_SERVER_PORT=8765

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Upload settings
upload_speed = 921600
upload_port = /dev/m5paper
monitor_port = /dev/m5paper
